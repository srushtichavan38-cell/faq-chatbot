<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Support Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="app-shell">
    <section class="chat-card" aria-label="FAQ support chatbot">
        <header class="chat-header">
            <div class="bot-avatar" aria-hidden="true">🤖</div>
            <div>
                <h1>FAQ Support Chatbot</h1>
                <p>Ask questions about admissions, fees, exams, student services and more.</p>
            </div>
            <button id="clearBtn" class="secondary-btn" type="button" title="Clear chat">Clear</button>
        </header>

        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

        <div class="suggestions" aria-label="Sample questions">
            <button class="suggestion-btn" type="button">How do I apply?</button>
            <button class="suggestion-btn" type="button">What documents are required?</button>
            <button class="suggestion-btn" type="button">What are the fees?</button>
            <button class="suggestion-btn" type="button">How can I contact support?</button>
        </div>

        <form id="chatForm" class="chat-input-area">
            <label class="sr-only" for="messageInput">Type your question</label>
            <input id="messageInput" name="message" type="text" maxlength="500" autocomplete="off" placeholder="Type your question..." required>
            <button id="sendBtn" class="send-btn" type="submit">Send</button>
        </form>
    </section>
</main>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
